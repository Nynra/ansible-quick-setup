---
- name: Set up bash environment
  block:
  - name: Set bash as default shell
    user:
      name: "{{ ansible_user_id }}"
      shell: /bin/bash

  - name: Get stats of a file
    ansible.builtin.stat:
      path: "{{ ansible_env.HOME }}/.bashrc"
    register: bash

  - name: bash debug    
    ansible.builtin.debug:
      msg: "bashrc file does not exist (path doesn't exist)"
    when: bash.stat.exists == False

  - name: bash debug
    ansible.builtin.debug:
      msg: "bashrc exists"
    when: bash.stat.exists 

  - name: Edit .bashrc file
    ansible.builtin.template:
      src: bashrc.j2
      dest: "{{ ansible_env.HOME }}/.bashrc"
      backup: yes

- name: Set up Tmux
  block:
  # Install tmux
  - name: Ensure tmux is installed
    ansible.builtin.apt:
      name: tmux
      state: present
    become: true

  - name: Create tmux configuration directory
    ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.tmux"
      state: directory
      mode: '0755'

  - name: Download tmux Plugin Manager
    ansible.builtin.git:
      repo: https://github.com/tmux-plugins/tpm 
      dest: "{{ ansible_env.HOME }}/.tmux/plugins/tpm"
      version: master

  - name: Change ownership of tmux configuration directory
    ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.tmux"
      owner: "{{ ansible_user_id }}"
      group: "{{ ansible_user_id }}"

  - name: Deploy .tmux.conf template
    ansible.builtin.template:
      src: tmux.conf.j2
      dest: "{{ ansible_env.HOME }}/.tmux.conf"
      mode: '0644'

  - name: Create Tmux Log Workspace Launcher
    ansible.builtin.template:
      src: tm-workspace.j2
      dest: /usr/local/bin/tm-workspace
      mode: '0755'
    become: true

