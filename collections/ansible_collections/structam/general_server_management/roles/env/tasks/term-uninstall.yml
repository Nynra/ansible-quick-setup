---
- name: Remove terminal environment customizations
  block:
    - name: Remove the role-owned .bashrc block
      ansible.builtin.blockinfile:
        path: "{{ bashrc_path }}"
        marker: "# {mark} general-server-management bash"
        state: absent
      become: "{{ target_user_become }}"
      become_user: "{{ target_user }}"

    - name: Remove the role-owned .profile block
      ansible.builtin.blockinfile:
        path: "{{ profile_path }}"
        marker: "# {mark} general-server-management profile"
        state: absent
      become: "{{ target_user_become }}"
      become_user: "{{ target_user }}"
